name: Spider Jar Gen CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permissions for bat scripts
        run: |
          git update-index --chmod=+x ./build.bat
          git update-index --chmod=+x ./jar/danmu.bat
        shell: bash

      - name: Build with Gradle (custom_spider.jar)
        run: ./build.bat ec

      - name: Generate danmu.jar
        run: ./jar/danmu.bat

      - name: Upload jar as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: spider_jars
          path: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5
            ./jar/danmu.jar
            ./jar/danmu.jar.md5

      - name: Commit and push updated jar
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: 'update spider jar'
          add: |
            ./jar/custom_spider.jar
            ./jar/custom_spider.jar.md5
            ./jar/danmu.jar
            ./jar/danmu.jar.md5
